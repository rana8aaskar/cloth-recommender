name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fashion-api:latest

      - name: Deploy to Amazon EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Pull the brand new image
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/fashion-api:latest
            
            # 2. Stop and remove the old container safely (if it exists)
            sudo docker rm -f $(sudo docker ps -aq) || true
            
            # 3. Start the new container with the Volume Mount!
            sudo docker run -d -p 80:80 -v /home/ubuntu/chroma_storage:/app/chroma_storage ${{ secrets.DOCKER_USERNAME }}/fashion-api:latest
